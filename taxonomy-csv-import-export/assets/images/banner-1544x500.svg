<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg1544" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A3FBF"/>
      <stop offset="50%" stop-color="#7164e6"/>
      <stop offset="100%" stop-color="#9580FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1544" height="500" fill="url(#bg1544)"/>
  <!-- Subtle bottom darkening -->
  <rect width="1544" height="500" fill="black" fill-opacity="0.12"/>

  <!-- Decorative circles -->
  <circle cx="1420" cy="-50" r="260" fill="white" fill-opacity="0.06"/>
  <circle cx="1510" cy="540" r="220" fill="white" fill-opacity="0.05"/>
  <circle cx="50" cy="490" r="160" fill="white" fill-opacity="0.04"/>

  <!-- ── Icon ─────────────────────────────── -->
  <!-- Spreadsheet outline -->
  <rect x="96" y="86" width="192" height="230" rx="14" fill="none" stroke="white" stroke-width="14"/>
  <!-- Header row -->
  <line x1="96" y1="150" x2="288" y2="150" stroke="white" stroke-width="14"/>
  <!-- Data rows -->
  <line x1="96" y1="208" x2="288" y2="208" stroke="white" stroke-width="12"/>
  <line x1="96" y1="260" x2="288" y2="260" stroke="white" stroke-width="12"/>
  <!-- Column divider -->
  <line x1="192" y1="150" x2="192" y2="316" stroke="white" stroke-width="12"/>

  <!-- Export arrow (up) -->
  <line x1="350" y1="120" x2="350" y2="182" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <polyline points="318,134 350,94 382,134" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Import arrow (down) -->
  <line x1="350" y1="218" x2="350" y2="280" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <polyline points="318,266 350,306 382,266" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Text ──────────────────────────────── -->
  <text x="450" y="202" font-family="Arial,sans-serif" font-size="78" font-weight="700" fill="white" letter-spacing="-1">Taxonomy CSV</text>
  <text x="450" y="298" font-family="Arial,sans-serif" font-size="78" font-weight="700" fill="white" letter-spacing="-1">Import Export</text>
  <text x="453" y="356" font-family="Arial,sans-serif" font-size="24" fill="white" fill-opacity="0.82">Manage WordPress taxonomies &amp; users via CSV files.</text>

  <!-- ── Badge ─────────────────────────────── -->
  <rect x="1180" y="182" width="300" height="120" rx="18" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="1330" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="white" fill-opacity="0.75" letter-spacing="2.5">WORDPRESS</text>
  <text x="1330" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="600" fill="white">Plugin</text>
</svg>
